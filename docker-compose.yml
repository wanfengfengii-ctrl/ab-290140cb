name: score-clock

services:
  app:
    build: .
    image: score-clock-app
    environment:
      PORT: ${CONTAINER_PORT:-8080}
    ports:
      # Host port is configurable: APP_PORT=9090 docker compose up app
      - "${APP_PORT:-8080}:${CONTAINER_PORT:-8080}"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8080')+'/health',timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 25
      start_period: 5s
    restart: unless-stopped

  # One-shot verification: runs unit tests, the build step and API smoke
  # tests against the healthy app, then exits; its exit code is the result.
  verify:
    image: score-clock-app
    build: .
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:${CONTAINER_PORT:-8080}
    command: ["sh", "./verify.sh"]
